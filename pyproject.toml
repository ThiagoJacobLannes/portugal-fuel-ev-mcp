[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portugal-fuel-ev-mcp"
version = "0.1.0"
description = "MCP server for the cheapest fuel and nearby EV chargers in Portugal, from official open data (DGEG fuel prices, MOBI.E charging network)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27.0",
    "platformdirs>=3.0",
]

[project.urls]
Homepage = "https://github.com/ThiagoJacobLannes/portugal-fuel-ev-mcp"

[project.scripts]
portugal-fuel-ev-mcp = "portugal_fuel_ev_mcp.server:main"

[tool.setuptools]
packages = ["portugal_fuel_ev_mcp"]
